
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitMatch - Discover</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <link rel="stylesheet" href="/resources/discover/discover.css">
</head>

<body>

    <!-- Navigation Bar -->
    <nav class="gm-nav d-flex align-items-center px-4">

        <a href="#" class="gm-logo">
            <i class="bi bi-git"></i> Git<span>Match</span>
        </a>

        <ul class="nav ms-auto">
            <li class="nav-item">
                <a class="nav-link active" href="#">Discover</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="#">Projects</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="#">Messages</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="#">Profile</a>
            </li>
        </ul>

    </nav>


    <!-- Main Discover Page -->
    <main class="discover-container">

        <!-- Page Heading -->
        <div class="discover-heading">
            <h1>Discover</h1>
            <p>Find people who share your interests and want to build something together.</p>
        </div>


        <!-- Filter Options -->
        <div class="filter-section">

            <button class="filter-btn active" data-filter="all">
                All
            </button>

            <button class="filter-btn" data-filter="software">
                Software
            </button>

            <button class="filter-btn" data-filter="hardware">
                Hardware
            </button>

            <button class="filter-btn" data-filter="design">
               Design
            </button>

            <button class="filter-btn" data-filter="ai">
                AI / Machine Learning
            </button>

        </div>


        <!-- Profile Feed -->
        <section class="profile-feed" id="profileFeed">

           

        </section>

        <div id="emptyState" class="empty-state" hidden>
            <i class="bi bi-people"></i>
            <h3>No more profiles</h3>
            <p>Check back later for more people to connect with.</p>
        </div>

    </main>


    <!-- Connection Confirmation Modal -->
    <div class="modal fade" id="connectionModal" tabindex="-1">

        <div class="modal-dialog modal-dialog-centered">

            <div class="modal-content">

                <div class="modal-body text-center p-4">

                    <i class="bi bi-check-circle-fill success-icon"></i>

                    <h3>Connection Sent!</h3>

                    <p id="connectionMessage">
                        Your connection request has been sent.
                    </p>

                    <button class="btn btn-gm" data-bs-dismiss="modal">
                        Continue Discovering
                    </button>

                </div>

            </div>

        </div>

    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/resources/discover/discover.js"></script>

</body>
</html>
